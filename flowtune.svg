<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="86px" height="86px" viewBox="0 0 86 86">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="43" y1="1" x2="43" y2="85">
      <stop offset="0" stop-color="#EAE5C9"/>
      <stop offset="1" stop-color="#6CC6CB"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2.0" dy="2.8" stdDeviation="2.2" flood-color="#123b44" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- willow leaf: pointed at both ends -->
  <path fill="url(#bg)" d="M43 1
      C 62 12, 80 28, 80 43
      C 80 58, 62 74, 43 85
      C 24 74, 6 58, 6 43
      C 6 28, 24 12, 43 1 Z"/>

  <!-- circle -->
  <circle cx="43" cy="43" r="24" fill="none" stroke="#0E3B4A" stroke-width="5"/>

  <!-- back triangle (lower layer) -->
  <path d="M48 33 L62 44 L48 55 Z" fill="#0E3B4A" opacity="0.5"/>

  <!-- front triangle with shadow -->
  <path d="M33 31 L50 43 L33 55 Z" fill="#0E3B4A" filter="url(#shadow)"/>
</svg>
